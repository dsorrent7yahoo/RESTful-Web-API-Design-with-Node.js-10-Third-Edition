name: flask-fargate-ecs
# retrigger: path-filtered push marker v2

on:
  push:
    branches: [master, main, appmod/java-upgrade-20260716004919, flask-fargate-ecs, dynamodb-react]
    paths:
      - "Chapter04/flask-dynamo-db-backend/**"
      - "Chapter04/flask-dynamo-db-frontend/**"
      - "Chapter04/infra/terraform/flask-fargate-ecs/**"
      - ".github/workflows/flask-fargate-ecs.yml"
  pull_request:
    branches: [master, main]
    paths:
      - "Chapter04/flask-dynamo-db-backend/**"
      - "Chapter04/flask-dynamo-db-frontend/**"
      - "Chapter04/infra/terraform/flask-fargate-ecs/**"

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: sorrentino-fargate-fhir-demo-repo
  ECS_CLUSTER: sorrentino-fargate-fhir-demo-cluster
  ECS_SERVICE: sorrentino-fargate-fhir-demo-service
  ECS_TASK_FAMILY: sorrentino-fargate-fhir-demo-task
  CONTAINER_NAME: sorrentino-fargate-fhir-demo-api

jobs:
  test:
    name: Test Flask API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Chapter04/flask-dynamo-db-backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Chapter04/flask-dynamo-db-backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-cov moto[dynamodb]

      - name: Run unit tests
        run: pytest tests/ -v --tb=short --cov=. --cov-report=term-missing
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          DYNAMODB_TABLE: medications-test
          JWT_SECRET: ci-only-test-secret-not-used-in-prod
          PORT: "4001"
          AUTO_CREATE_CSV_TABLES: "false"

  build-and-push:
    name: Build & Push to ECR
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    outputs:
      image: ${{ steps.build.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        id: aws-creds-oidc-build
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN || secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Fallback to static AWS credentials (build)
        if: steps.aws-creds-oidc-build.outcome == 'failure'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate AWS credentials (build)
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to ECR
        id: build
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -f Chapter04/flask-dynamo-db-backend/Dockerfile \
            -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            -t "$REGISTRY/$ECR_REPOSITORY:latest" \
            Chapter04

          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"

          echo "image=$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to ECS Fargate
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        id: aws-creds-oidc-deploy
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN || secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Fallback to static AWS credentials (deploy)
        if: steps.aws-creds-oidc-deploy.outcome == 'failure'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate AWS credentials (deploy)
        run: aws sts get-caller-identity

      - name: Ensure ECS service has at least one running task
        run: |
          aws ecs update-service \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --service "${{ env.ECS_SERVICE }}" \
            --desired-count 1 > /dev/null

      - name: Fetch current task definition from ECS
        run: |
          aws ecs describe-task-definition \
            --task-definition "${{ env.ECS_TASK_FAMILY }}" \
            --query taskDefinition \
            > task-definition.json

      - name: Render updated task definition with new image
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ needs.build-and-push.outputs.image }}

      - name: Deploy updated task definition to ECS service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
