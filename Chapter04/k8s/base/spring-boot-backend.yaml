apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-boot-backend
  namespace: healthcare
  labels:
    app: spring-boot-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spring-boot-backend
  template:
    metadata:
      labels:
        app: spring-boot-backend
    spec:
      containers:
        - name: spring-boot-backend
          image: localhost:5000/spring-boot-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4003
          env:
            - name: SERVER_PORT
              value: "4003"
          envFrom:
            - configMapRef:
                name: microservices-config
            - secretRef:
                name: microservices-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 4003
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 4003
            initialDelaySeconds: 60
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: spring-boot-backend
  namespace: healthcare
spec:
  selector:
    app: spring-boot-backend
  type: NodePort
  ports:
    - protocol: TCP
      port: 4003
      targetPort: 4003
      nodePort: 30007
