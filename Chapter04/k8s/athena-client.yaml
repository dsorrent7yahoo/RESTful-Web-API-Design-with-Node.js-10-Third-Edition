apiVersion: apps/v1
kind: Deployment
metadata:
  name: athena-client
  namespace: healthcare
  labels:
    app: athena-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: athena-client
  template:
    metadata:
      labels:
        app: athena-client
    spec:
      containers:
        - name: athena-client
          image: athena-client:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 4014
          envFrom:
            - configMapRef:
                name: microservices-config
            - secretRef:
                name: microservices-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 4014
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 4014
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: athena-client
  namespace: healthcare
spec:
  selector:
    app: athena-client
  type: NodePort
  ports:
    - protocol: TCP
      port: 4014
      targetPort: 4014
      nodePort: 30004
