apiVersion: apps/v1
kind: Deployment
metadata:
  name: claims-cleaner
  namespace: healthcare
  labels:
    app: claims-cleaner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: claims-cleaner
  template:
    metadata:
      labels:
        app: claims-cleaner
    spec:
      containers:
        - name: claims-cleaner
          image: claims-cleaner:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 4012
          envFrom:
            - configMapRef:
                name: microservices-config
            - secretRef:
                name: microservices-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 4012
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 4012
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: claims-cleaner
  namespace: healthcare
spec:
  selector:
    app: claims-cleaner
  type: NodePort
  ports:
    - protocol: TCP
      port: 4012
      targetPort: 4012
      nodePort: 30002
