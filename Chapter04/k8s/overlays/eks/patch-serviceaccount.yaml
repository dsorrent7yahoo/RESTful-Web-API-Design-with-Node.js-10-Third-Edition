# Bind all microservice Deployments to the IRSA ServiceAccount.
# The SA annotation causes EKS to inject short-lived AWS credentials via
# a projected token — no static AWS_ACCESS_KEY_ID/SECRET needed in pods.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: not-used
  namespace: healthcare
spec:
  template:
    spec:
      serviceAccountName: microservices-sa
