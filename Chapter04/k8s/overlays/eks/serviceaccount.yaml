# IRSA ServiceAccount — annotated with the IAM role ARN produced by Terraform.
# Update the role-arn annotation value after running:
#   terraform output microservices_irsa_role_arn
apiVersion: v1
kind: ServiceAccount
metadata:
  name: microservices-sa
  namespace: healthcare
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::005905648819:role/healthcare-fhir-eks-microservices-irsa
