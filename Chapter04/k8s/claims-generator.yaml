apiVersion: apps/v1
kind: Deployment
metadata:
  name: claims-generator
  namespace: healthcare
  labels:
    app: claims-generator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: claims-generator
  template:
    metadata:
      labels:
        app: claims-generator
    spec:
      containers:
        - name: claims-generator
          image: claims-generator:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 4011
          envFrom:
            - configMapRef:
                name: microservices-config
            - secretRef:
                name: microservices-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 4011
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 4011
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: claims-generator
  namespace: healthcare
spec:
  selector:
    app: claims-generator
  type: NodePort
  ports:
    - protocol: TCP
      port: 4011
      targetPort: 4011
      nodePort: 30001
