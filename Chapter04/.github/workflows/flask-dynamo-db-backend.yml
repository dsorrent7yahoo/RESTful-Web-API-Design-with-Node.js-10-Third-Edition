name: flask-dynamo-db-backend

on:
  push:
    branches: [master, main, dynamodb-react]
    paths:
      - "flask-dynamo-db-backend/**"
      - "coherent-11-07-2022/**"
      - ".github/workflows/flask-dynamo-db-backend.yml"
  pull_request:
    branches: [master, main]
    paths:
      - "flask-dynamo-db-backend/**"

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: sorrentino-fargate-fhir-demo-repo        # terraform output: ecr_repository_url (repo name only)
  ECS_CLUSTER: sorrentino-fargate-fhir-demo-cluster        # terraform output: ecs_cluster_name
  ECS_SERVICE: sorrentino-fargate-fhir-demo-service        # terraform output: ecs_service_name
  ECS_TASK_FAMILY: sorrentino-fargate-fhir-demo-task       # terraform output: ecs_task_family
  CONTAINER_NAME: sorrentino-fargate-fhir-demo-api         # terraform output: container_name

jobs:
  # ── Test ───────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flask-dynamo-db-backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: flask-dynamo-db-backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-cov moto[dynamodb]

      - name: Run tests
        run: pytest tests/ -v --tb=short --cov=. --cov-report=term-missing
        env:
          AWS_DEFAULT_REGION: us-east-1
          # moto intercepts boto3 calls — dummy credentials are intentional
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          DYNAMODB_TABLE: medications-test
          JWT_SECRET: ci-only-test-secret-not-used-in-prod
          PORT: "4001"
          AUTO_CREATE_CSV_TABLES: "false"

  # ── Build & Push ───────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push to ECR
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for OIDC token exchange
      contents: read

    outputs:
      image: ${{ steps.build.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        id: build
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -f flask-dynamo-db-backend/Dockerfile \
            -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            -t "$REGISTRY/$ECR_REPOSITORY:latest" \
            .
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"
          echo "image=$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

  # ── Deploy ─────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to ECS Fargate
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Fetch current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "${{ env.ECS_TASK_FAMILY }}" \
            --query taskDefinition \
            > task-definition.json

      - name: Render updated task definition
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ needs.build-and-push.outputs.image }}

      - name: Deploy updated task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
