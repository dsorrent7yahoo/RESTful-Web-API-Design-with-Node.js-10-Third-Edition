services:

  # ── Landing page (port 5180 — primary entry point) ─────────────────────────
  landing:
    build:
      context: ./landing-page
    image: healthcare-landing:local
    container_name: healthcare-landing
    ports:
      - "5180:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/ > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - spring-net

  # ── Spring Boot Backend (port 4004) ─────────────────────────────────────────
  spring-boot-backend:
    build:
      context: ./spring-boot-backend
      dockerfile: Dockerfile
    image: healthcare-spring-boot-backend:local
    container_name: healthcare-spring-boot-backend
    ports:
      - "4004:4003"
    environment:
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:-}
      - SPRING_PROFILES_ACTIVE=docker
    volumes:
      - ${USERPROFILE}/.aws:/root/.aws:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/4003' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s
    networks:
      - spring-net

  # ── Angular Frontend served via nginx (port 5181) ───────────────────────────
  angular-frontend:
    build:
      context: ./angular-spring-boot-frontend
      dockerfile: Dockerfile.nginx
    image: healthcare-angular-frontend:local
    container_name: healthcare-angular-frontend
    ports:
      - "5181:80"
    depends_on:
      spring-boot-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/ > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - spring-net

networks:
  spring-net:
    driver: bridge
