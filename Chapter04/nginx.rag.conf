# nginx.rag.conf — Reverse-proxy for the combined Healthcare RAG image
#
# Port 80:
#   /                  → Preact SPA static files (SPA fallback: index.html)
#   /health            → rag-core :4005  /health
#   /rag/              → rag-core :4005  /rag/
#   /docs              → rag-core :4005  /docs  (Swagger UI)
#   /api/pharmacist/   → pharmacist :4006  (strips /api/pharmacist prefix)
#   /api/ehr/          → ehr-query  :4007  (strips /api/ehr prefix)
#   /api/diagnosis/    → diagnosis  :4008  (strips /api/diagnosis prefix)
#   /api/              → config-api :4009  (strips /api prefix → /config/...)

server {
    listen 80;
    server_name _;

    # ── Preact SPA ─────────────────────────────────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    # ── Core RAG API health + Swagger ─────────────────────────────────────────
    location = /health {
        proxy_pass         http://127.0.0.1:4005/health;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    location /rag/ {
        proxy_pass         http://127.0.0.1:4005/rag/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    location /docs {
        proxy_pass         http://127.0.0.1:4005/docs;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    location /openapi.json {
        proxy_pass         http://127.0.0.1:4005/openapi.json;
        proxy_set_header   Host $host;
    }

    # ── Pharmacist Review API  (:4006) ────────────────────────────────────────
    # /api/pharmacist/review/... → :4006/review/...
    location /api/pharmacist/ {
        proxy_pass         http://127.0.0.1:4006/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    # ── EHR Query API  (:4007) ────────────────────────────────────────────────
    # /api/ehr/...  → :4007/...
    location /api/ehr/ {
        proxy_pass         http://127.0.0.1:4007/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    # ── Diagnosis Support API  (:4008) ────────────────────────────────────────
    # /api/diagnosis/... → :4008/...
    location /api/diagnosis/ {
        proxy_pass         http://127.0.0.1:4008/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    # ── Config / Doc Browser API  (:4009) ─────────────────────────────────────
    # /api/config/... → :4009/config/...  (strips only /api, keeps /config/...)
    location /api/ {
        proxy_pass         http://127.0.0.1:4009/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    # ── SPA catch-all ─────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
