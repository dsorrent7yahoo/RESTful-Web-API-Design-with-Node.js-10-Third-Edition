version: 0.2

phases:
  pre_build:
    commands:
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - IMAGE_TAG=${CODEBUILD_RESOLVED_SOURCE_VERSION:-latest}
      - IMAGE_TAG=${IMAGE_TAG:0:12}
      - echo Logging in to Amazon ECR in ${AWS_REGION}
      - aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${ECR_REPOSITORY_URI}
  build:
    commands:
      - echo Building Docker image ${ECR_REPOSITORY_URI}:${IMAGE_TAG}
      - docker build -t ${ECR_REPOSITORY_URI}:${IMAGE_TAG} -f flask-dynamo-db-backend/Dockerfile .
      - docker tag ${ECR_REPOSITORY_URI}:${IMAGE_TAG} ${ECR_REPOSITORY_URI}:latest
  post_build:
    commands:
      - echo Pushing images to ECR
      - docker push ${ECR_REPOSITORY_URI}:${IMAGE_TAG}
      - docker push ${ECR_REPOSITORY_URI}:latest
      - printf '[{"name":"%s","imageUri":"%s"}]' "${ECS_CONTAINER_NAME}" "${ECR_REPOSITORY_URI}:${IMAGE_TAG}" > imagedefinitions.json
artifacts:
  files:
    - imagedefinitions.json
