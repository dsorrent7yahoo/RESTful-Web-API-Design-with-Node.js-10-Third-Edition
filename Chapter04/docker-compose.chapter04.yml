version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chapter04-api
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      MONGO_URL: mongodb://mongo:27017/catalog
      JWT_SECRET: chapter04-docker-secret
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: chapter04-mongo
    ports:
      - "27018:27017"          # host 27018 avoids clash with local mongod on 27017
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  mongo-data:
