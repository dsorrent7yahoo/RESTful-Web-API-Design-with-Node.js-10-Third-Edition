; supervisord.rag.conf — Process manager for the combined Healthcare RAG container
;
; Manages:
;   nginx          :80    static SPA + reverse proxy
;   rag-core       :4005  main.py           — Core RAG / embeddings
;   pharmacist     :4006  pharmacist_review.py
;   ehr-query      :4007  ehr_query.py
;   diagnosis      :4008  diagnosis_support.py
;   config-api     :4009  config_api.py

[supervisord]
nodaemon=true
user=root
logfile=/var/log/rag/supervisord.log
logfile_maxbytes=10MB
logfile_backups=2
loglevel=info
pidfile=/var/run/supervisord.pid

; ── nginx ────────────────────────────────────────────────────────────────────
[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/rag/nginx.log
stdout_logfile_maxbytes=5MB
stderr_logfile=/var/log/rag/nginx-err.log
stderr_logfile_maxbytes=5MB

; ── Core RAG API (:4005) — embeddings + vector store ─────────────────────────
[program:rag-core]
command=uvicorn main:app --host 127.0.0.1 --port 4005 --workers 1
directory=/app
autostart=true
autorestart=true
priority=20
startsecs=10
stdout_logfile=/var/log/rag/rag-core.log
stdout_logfile_maxbytes=5MB
stderr_logfile=/var/log/rag/rag-core-err.log
stderr_logfile_maxbytes=5MB

; ── Pharmacist Review API (:4006) ─────────────────────────────────────────────
[program:pharmacist]
command=uvicorn pharmacist_review:app --host 127.0.0.1 --port 4006 --workers 1
directory=/app
autostart=true
autorestart=true
priority=30
startsecs=5
stdout_logfile=/var/log/rag/pharmacist.log
stdout_logfile_maxbytes=5MB
stderr_logfile=/var/log/rag/pharmacist-err.log
stderr_logfile_maxbytes=5MB

; ── EHR Query API (:4007) ────────────────────────────────────────────────────
[program:ehr-query]
command=uvicorn ehr_query:app --host 127.0.0.1 --port 4007 --workers 1
directory=/app
autostart=true
autorestart=true
priority=30
startsecs=5
stdout_logfile=/var/log/rag/ehr-query.log
stdout_logfile_maxbytes=5MB
stderr_logfile=/var/log/rag/ehr-query-err.log
stderr_logfile_maxbytes=5MB

; ── Diagnosis Support API (:4008) ────────────────────────────────────────────
[program:diagnosis]
command=uvicorn diagnosis_support:app --host 127.0.0.1 --port 4008 --workers 1
directory=/app
autostart=true
autorestart=true
priority=30
startsecs=5
stdout_logfile=/var/log/rag/diagnosis.log
stdout_logfile_maxbytes=5MB
stderr_logfile=/var/log/rag/diagnosis-err.log
stderr_logfile_maxbytes=5MB

; ── Config / Doc Browser API (:4009) ─────────────────────────────────────────
[program:config-api]
command=uvicorn config_api:app --host 127.0.0.1 --port 4009 --workers 1
directory=/app
autostart=true
autorestart=true
priority=30
startsecs=5
stdout_logfile=/var/log/rag/config-api.log
stdout_logfile_maxbytes=5MB
stderr_logfile=/var/log/rag/config-api-err.log
stderr_logfile_maxbytes=5MB
